<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Big Bang</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #000;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      #camera-feed {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 0;
        opacity: 0.95;
        transform: scaleX(-1); /* espelha como selfie */
      }

      #three-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: all;
      }

      #status {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        color: rgba(0, 170, 255, 0.5);
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        font-family: 'Courier New', monospace;
        pointer-events: none;
        white-space: nowrap;
      }

      #camera-error {
        position: absolute;
        inset: 0;
        z-index: 20;
        background: #000508;
        color: #00AAFF;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-size: 13px;
        letter-spacing: 2px;
        font-family: 'Courier New', monospace;
      }

      #camera-error.visible { display: flex; }

      #hand-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }

      #hand-status {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        color: rgba(255,255,255,0.2);
        font-family: 'Courier New', monospace;
        font-size: 9px;
        letter-spacing: 3px;
        pointer-events: none;
      }

      #label-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 3;
        pointer-events: none;
      }

      #label-canvas.interactive { pointer-events: all; }

      #scan-status {
        position: absolute;
        top: 38px;
        left: 20px;
        z-index: 10;
        color: rgba(0,255,180,0.65);
        font-family: 'Courier New', monospace;
        font-size: 9px;
        letter-spacing: 2px;
        pointer-events: none;
      }

      #scan-toggle {
        position: absolute;
        top: 20px;
        right: 200px;
        z-index: 10;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(0,200,255,0.35);
        color: rgba(0,200,255,0.7);
        font-family: 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 2px;
        padding: 6px 14px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        border-radius: 2px;
        transition: all 0.15s;
      }

      #scan-toggle.active {
        border-color: #00FFCC;
        color: #00FFCC;
        background: rgba(0,255,180,0.1);
        box-shadow: 0 0 14px rgba(0,255,180,0.3);
      }

      #shape-selector {
        position: absolute;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 10px;
        pointer-events: all;
      }

      #shape-selector button {
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(0, 170, 255, 0.3);
        color: rgba(0, 170, 255, 0.6);
        font-family: 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 8px 16px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: all 0.15s ease;
        border-radius: 2px;
      }

      #shape-selector button:hover {
        border-color: rgba(0, 170, 255, 0.7);
        color: rgba(0, 170, 255, 1);
        background: rgba(0, 170, 255, 0.08);
      }

      #shape-selector button.active {
        border-color: #00AAFF;
        color: #00AAFF;
        background: rgba(0, 170, 255, 0.14);
        box-shadow: 0 0 12px rgba(0, 170, 255, 0.25);
      }

      #transform-mode {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: none;
        gap: 8px;
        pointer-events: all;
      }

      #transform-mode button {
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(139, 92, 246, 0.35);
        color: rgba(139, 92, 246, 0.65);
        font-family: 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 6px 14px;
        cursor: pointer;
        backdrop-filter: blur(8px);
        transition: all 0.15s ease;
        border-radius: 2px;
      }

      #transform-mode button:hover {
        border-color: rgba(139, 92, 246, 0.8);
        color: rgba(139, 92, 246, 1);
      }

      #transform-mode button.active {
        border-color: #8B5CF6;
        color: #8B5CF6;
        background: rgba(139, 92, 246, 0.14);
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.3);
      }

      #info-panel {
        display: none;
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
        background: rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(0, 170, 255, 0.25);
        backdrop-filter: blur(10px);
        padding: 14px 18px;
        border-radius: 3px;
        pointer-events: none;
        min-width: 160px;
      }

      #info-panel .info-title {
        color: #00AAFF;
        font-family: 'Courier New', monospace;
        font-size: 10px;
        letter-spacing: 3px;
        margin-bottom: 10px;
        opacity: 0.9;
      }

      #info-panel .info-group {
        margin-bottom: 8px;
      }

      #info-panel .info-label {
        color: rgba(0, 170, 255, 0.4);
        font-family: 'Courier New', monospace;
        font-size: 9px;
        letter-spacing: 2px;
        margin-bottom: 3px;
      }

      #info-panel .info-row {
        display: flex;
        gap: 8px;
        font-family: 'Courier New', monospace;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.75);
      }

      #info-panel .info-row span { min-width: 44px; }
      #info-panel .axis { color: rgba(0, 170, 255, 0.5); margin-right: 2px; }

      #info-panel .delete-hint {
        margin-top: 10px;
        color: rgba(236, 73, 153, 0.5);
        font-family: 'Courier New', monospace;
        font-size: 9px;
        letter-spacing: 1px;
        border-top: 1px solid rgba(255,255,255,0.06);
        padding-top: 8px;
      }
    </style>
  </head>
  <body>
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>
    <canvas id="hand-canvas"></canvas>
    <canvas id="label-canvas"></canvas>
    <div id="hand-status">◌ BRIDGE OFFLINE</div>
    <div id="scan-status"></div>
    <button id="scan-toggle">◎ SCAN MODE</button>
    <div id="info-panel">
      <div class="info-title" id="info-shape">OBJETO</div>
      <div class="info-group">
        <div class="info-label">POSIÇÃO</div>
        <div class="info-row">
          <span><span class="axis">X</span><span id="info-px">0.00</span></span>
          <span><span class="axis">Y</span><span id="info-py">0.00</span></span>
          <span><span class="axis">Z</span><span id="info-pz">0.00</span></span>
        </div>
      </div>
      <div class="info-group">
        <div class="info-label">ROTAÇÃO °</div>
        <div class="info-row">
          <span><span class="axis">X</span><span id="info-rx">0.00</span></span>
          <span><span class="axis">Y</span><span id="info-ry">0.00</span></span>
          <span><span class="axis">Z</span><span id="info-rz">0.00</span></span>
        </div>
      </div>
      <div class="info-group">
        <div class="info-label">ESCALA</div>
        <div class="info-row">
          <span><span class="axis">X</span><span id="info-sx">1.00</span></span>
          <span><span class="axis">Y</span><span id="info-sy">1.00</span></span>
          <span><span class="axis">Z</span><span id="info-sz">1.00</span></span>
        </div>
      </div>
      <div class="delete-hint">DEL · REMOVER</div>
    </div>
    <div id="transform-mode">
      <button data-mode="translate">T · MOVER</button>
      <button data-mode="rotate">R · ROTACIONAR</button>
      <button data-mode="scale">S · ESCALAR</button>
    </div>
    <div id="shape-selector">
      <button data-shape="cube">◻ CUBO</button>
      <button data-shape="sphere">◯ ESFERA</button>
      <button data-shape="cylinder">⬭ CILINDRO</button>
    </div>
    <div id="status">BIG BANG · INITIALIZING</div>
    <div id="camera-error">
      <span>⚠ CÂMERA INDISPONÍVEL</span>
      <span style="opacity:0.4;font-size:10px;margin-top:4px">RODANDO SEM FEED DE CÂMERA</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
